### ### Core Connect2id Server Configuration ### ###

# The default configuration of the core Connect2id server properties. Can be
# overridden with Java system properties.
#
# https://connect2id.com/products/server/docs/config/core


### General ###

# The URL identifying the OpenID provider / OAuth 2.0 authorisation server. The
# issuer ("iss") claim in the ID and access tokens will be set to this URL.
# Should be set to the base public URL of the Connect2id server and specify an
# https schema.
op.issuer=http://127.0.0.1:8080/c2id

# Optional issuer alias URLs of the OpenID provider / OAuth 2.0 authorisation
# server. Can be used to migrate from one issuer URL to another (op.issuer), or
# to operate an OpenID provider / OAuth 2.0 authorisation server known by
# multiple URLs. An "op.issuerAliases=*" property enables the HTTP reverse
# proxy to determine the whitelisted issuer alias URLs, for deployments where
# issuer aliases must be added or removed dynamically. Leave blank if none.
op.issuerAliases.1=
op.issuerAliases.2=
op.issuerAliases.3=

# The issuer alias mode when issuer aliases of the OpenID provider / OAuth 2.0
# authorisation server are enabled.
#
# Supported modes:
#
#     * MIGRATION -- Enables seamless migration over time to a new issuer URL.
#       This is the default mode.
#     * PERSISTED_GRANT_ISOLATION -- Enforces persisted grant isolation between
#       issuer aliases: disables long-lived (persisted) consent; forces issue
#       of self-contained (stateless) refresh tokens; blocks the use of any
#       previously issued identifier-based refresh tokens.
#
op.issuerAliasMode=MIGRATION

# URL of the OpenID provider's / OAuth 2.0 authorisation server's policy
# regarding relying parties' / clients' use of data, in human-readable form.
# The URL can be also be specified relative to the issuer URL (op.issuer).
# Leave blank if not specified.
op.policy=

# URL of the OpenID provider's / OAuth 2.0 authorisation server's terms of
# service, in human-readable form. The URL can be also be specified relative to
# the issuer URL (op.issuer). Leave blank if not specified.
op.tos=

# URL of the OpenID provider's / OAuth 2.0 authorisation server's service
# documentation for developers, in human-readable form. The URL can be also be
# specified relative to the issuer URL (op.issuer). Leave blank if not
# specified.
op.serviceDocs=

# The splash page to display at the Connect2id server issuer URL (op.issuer).
# The default value is urn:c2id:splash_page:default.
#
# Supported values:
#
#     * urn:c2id:splash_page:default -- The default splash page, an HTML page
#       showing the Connect2id server version, a list of the available
#       endpoints and links to public online documentation.
#     * urn:c2id:splash_page:blank -- A blank page.
#     * urn:c2id:splash_page:op_metadata -- Redirects (HTTP 301) to the OpenID
#       provider metadata at /.well-known/openid-configuration
#     * An https or http URL -- Redirects (HTTP 301) to the specified HTTPS or
#       HTTP URL.
op.splashPage=urn:c2id:splash_page:default

# Custom OpenID provider / OAuth 2.0 authorisation server metadata to be
# included for publishing at the ".well-known/openid-configuration" and
# ".well-known/oauth-authorization-server" endpoints. If set the metadata must
# be represented as a JSON object string containing the custom fields, and can
# be additionally BASE64 encoded to ease passing the configuration property
# from a command line shell.
op.customMetadata=

# A JSON object overlay to apply to the OpenID provider / OAuth 2.0
# authorisation server metadata published at the
# ".well-known/openid-configuration" and
# ".well-known/oauth-authorization-server" endpoints. Non-null values in the
# overlay object replace existing metadata fields, null values remove them.
# Note, the overlay does not affect the internal Connect2id server
# configuration and the resulting JSON object is not checked for being a legal
# representation of OpenID provider / OAuth 2.0 authorisation server metadata.
# If set the overlay must be represented as a JSON object string, and can be
# additionally BASE64 encoded to ease passing the configuration property from
# a command line shell.
op.metadataOverlay=


### Client registry ###

# Enables / disables open (also called dynamic) registration of clients for the
# "authorization_code", "implicit" and "refresh_token" grants. Open
# registration is intended primarily for public Connect2id servers configured
# for automatic OpenID provider discovery, see
# http://openid.net/specs/openid-connect-discovery-1_0.html .
#
# Open registration is disabled by default for security reasons. If in doubt
# whether open registration should be enabled contact Connect2id support.
op.reg.allowOpenRegistration=false

# Rejects / allows registration of non-TLS (plain HTTP and other unprotected)
# redirection URIs in the authorisation code flow (response_type=code). TLS
# (https) is always required for clients that register for the implicit flow.
# The default value is true.
op.reg.rejectNonTLSRedirectionURIs=true

# Allows registration of HTTP and HTTPS localhost redirection URIs for OAuth
# 2.0 web application client test and development purposes. Must not be allowed
# in production! The default value is false (not allowed).
op.reg.allowLocalhostRedirectionURIsForTest=false

# Allows registration of non-TLS (plain HTTP) front and back-channel logout
# URIs for test and development purposes. Must not be allowed in production!
# The default value is false (not allowed).
op.reg.allowNonTLSLogoutURIsForTest=false

# Enables / disables registration of OpenID provider managed sector identifiers
# for the computation of pairwise subject (end-user) identifiers in issued ID
# tokens and in UserInfo responses. A managed sector identifier can be
# registered with the "sector_identifier_uri" set to a URN with the format
# urn:c2id:sector_id:<id>. The registration requires a master API token or a
# one-time registration token with a "client-reg:set-sector-id-urn" scope
# value. The default value is false.
op.reg.enableProviderManagedSectorIDs=false

# The byte length of generated registration access tokens. Must be at least 32
# bytes long to make brute force guessing impractical. The default value is 32.
op.reg.accessTokenByteLength=32

# Enables / disables refreshing of the registration access token with each
# client registration update. The default value is true (enabled).
op.reg.refreshAccessTokenOnUpdate=true

# The byte length of generated client identifiers. Must be at least 8 bytes
# long to provide a sufficiently large identifier space. Must not exceed 48
# bytes. The default value is 8 bytes.
op.reg.clientIDByteLength=8

# The lifetime of issued client secrets, in hours. Zero implies no expiration.
# The default value is 0 (no expiration).
op.reg.clientSecretLifetime=0

# Enables / disables refreshing of the client secret with each client
# registration update. If false the client secret will be refreshed only if it
# has expired. The default value is true.
op.reg.alwaysRefreshClientSecretOnUpdate=true

# The maximum allowed number of registered request URIs ("request_uris"). The
# default value is 10.
op.reg.requestURIQuota=10

# If true the initial registration access token must include an audience value
# that is the OpenID provider / OAuth 2.0 authorisation server issuer URI or
# the client registration endpoint URI, else the access token won't be
# accepted. The default value is true.
op.reg.requireInitialAccessTokenAudience=true

# Master access token for the entire client registration web API, represented
# by its SHA-256 hash (in hexadecimal format). The hash is a measure to
# prevent accidental leakage of the token through configuration files, logs,
# etc. The token is of type Bearer, non-expiring and must contain at least 32
# random alphanumeric characters to make brute force guessing impractical. If
# not specified the web API is disabled.
#
# Additional access tokens, for token roll-over or other needs, can be
# configured by appending a dot (.) with a unique label to the property name,
# e.g. as op.reg.apiAccessTokenSHA256.1=abc...
#
# Evaluation note: Use token value ztucZS1ZyFKgh0tUEruUtiSTXhnexmd6
op.reg.apiAccessTokenSHA256=cca68b8b82bcf0b96cb826199429e50cd95a042f8e8891d1ac56ab135d096633

# The HTTP connect timeout (in milliseconds) for retrieving client resources
# (JWK sets and request objects specified by URI). Zero implies no timeout. The
# default value is 1000 ms.
op.reg.resourceRetriever.httpConnectTimeout=1000

# The HTTP read timeout (in milliseconds) for retrieving client resources (JWK
# sets and request objects specified by URI). Zero implies no timeout. The
# default value is 1000 ms.
op.reg.resourceRetriever.httpReadTimeout=1000

# Enforces a size limit on the entity body of HTTP POST and PUT requests to the
# client registration web API. Configurable via Java system property only! The
# default value is 250 thousand characters.
op.reg.httpMaxRequestSize=250000


### Single sign-on (SSO) ###

# Enables / disables OpenID Connect Native SSO 1.0. Disabled by default.
op.sso.nativeClientGroup.enable=false

# The maximum native client group session lifetime, in minutes. A negative
# value implies no time limit. Must not be zero. The default value is 259200
# minutes (180 days).
op.sso.nativeClientGroup.sessionMaxLifetime=259200

# The native client group session maximum authentication lifetime, in minutes.
# A negative value implies no time limit. Must not be zero. The default value
# is 10080 minutes (30 days).
op.sso.nativeClientGroup.sessionAuthLifetime=43200

# The maximum native client group session idle time, in minutes. A negative
# value implies no time limit. Must not be zero. The default value is 1440
# minutes (10 days).
op.sso.nativeClientGroup.sessionMaxIdleTime=14400

# Disables single SSO for selected clients. Ensures end-users will be always
# (re)authenticated on the first OAuth 2.0 authorisation / OpenID
# authentication request when end-user has an existing session with the
# Connect2id server. Subsequent requests from the client received into the same
# end-user session will be processed as usual, without triggering
# re-authentication of the end-user.
#
# Disabling SSO for a client creates the effect of "virtual" client-based
# sessions with the Connect2id server.
#
# Clients with disabled SSO are selected by configuring a JSON query that
# accepts the client registration (as JSON object representation) and returns a
# boolean true result. The default value is no selector specified.
#
# Deprecated in v16.1, use the WebSSOEligibilityChecker SPI instead.
op.sso.disableForSelectedClients=


### Pairwise subjects ###

# Enables output of pairwise subject identifiers with a uniform string length
# which is not affected by the length of the local (system) subject identifier.
# This measure is intended to prevent leaking information about the length of
# the local subject identifiers. Uniformity is achieved by padding local
# subject identifiers up to the specified length, which should be the maximum
# expected length of the local subjects. Subjects longer than the configured
# length will result in a pairwise encoding that is proportionally longer.
#
# -1 (negative integer) disables padding.
#
# Important note: Changing the padding length will reset all previously issued
# pairwise subject identifiers!
op.pairwiseSubjects.padLocalSubjectsToLength=-1


### ID token ###

# The default ID token lifetime, in seconds. Used to set the ID token
# expiration time ("exp") after which the token must not be accepted by the
# client for processing. Can be overridden by individual authorisations. Must
# be a positive integer. The default value is 300 seconds.
op.idToken.defaultLifetime=300

# The enabled JWS algorithms for signing issued ID tokens. The default value is
# all supported, with "none" excluded.
#
# Supported JWS algorithms:
#
#     * RS256
#     * RS384
#     * RS512
#     * PS256
#     * PS384
#     * PS512
#     * ES256
#     * ES256K
#     * ES384
#     * ES512
#     * HS256
#     * HS384
#     * HS512
#     * EdDSA
#     * none (use not recommended)
#
# The algorithm "RS256" must be always included. The value "none" may be
# included, but must not be used unless the response type used returns no ID
# token from the authorisation endpoint (such as when using the authorisation
# code flow).
#
# The first JWS algorithm in the list becomes the default algorithm in client
# registration.
op.idToken.jwsAlgs=RS256,RS384,RS512,PS256,PS384,PS512,ES256,ES256K,ES384,ES512,HS256,HS384,HS512,EdDSA

# The enabled JWE key management algorithms for applying optional additional
# encryption to issued ID tokens. The default value is all supported.
#
# Supported JWE algorithms:
#
#     * RSA-OAEP-256
#     * RSA-OAEP-384
#     * RSA-OAEP-512
#     * RSA1_5 (use no longer recommended)
#     * RSA-OAEP (use no longer recommended)
#     * ECDH-ES
#     * ECDH-ES+A128KW
#     * ECDH-ES+A192KW
#     * ECDH-ES+A256KW
#     * dir
#     * A128KW
#     * A192KW
#     * A256KW
#     * A128GCMKW
#     * A192GCMKW
#     * A256GCMKW
#
op.idToken.jweAlgs=RSA-OAEP-256,RSA-OAEP-384,RSA-OAEP-512,ECDH-ES,ECDH-ES+A128KW,ECDH-ES+A192KW,ECDH-ES+A256KW,dir,A128KW,A192KW,A256KW,A128GCMKW,A192GCMKW,A256GCMKW

# The enabled JWE content encryption methods for applying optional additional
# encryption to issued ID tokens. The default value is all supported.
#
# Supported JWE methods:
#
#     * A128CBC-HS256
#     * A192CBC-HS384
#     * A256CBC-HS512
#     * A128GCM
#     * A192GCM
#     * A256GCM
#     * XC20P
#
op.idToken.jweEncs=A128CBC-HS256,A192CBC-HS384,A256CBC-HS512,A128GCM,A192GCM,A256GCM,XC20P

# Enables / disables inclusion of a state hash claim ("s_hash") in issued ID
# tokens. The default value is false (disabled).
op.idToken.includeStateHash=false

# Enables / disables inclusion of a JWT ID claim ("jti") in issued ID tokens.
# The default value is false (disabled).
op.idToken.includeJWTID=false

# Enables / disables inclusion of the X.509 certificate chain ("x5c") header
# parameter in issued ID tokens when the signing JWK is provisioned with a
# certificate. The default value is true (enabled).
op.idToken.includeX5C=true

# Controls the automatic inclusion of members from the subject session "claims"
# JSON object in issued ID tokens. Applies to regular and prompt=none OpenID
# authentication requests as well as ID token refreshes. An "*" (asterisk)
# selects all members. The member names can alternatively be specified as comma
# and / or space separated list. An empty list disables the inclusion. The
# default value is "*" (include all).
op.idToken.includeSubjectSessionClaims=*

# Specifies if ID tokens should be returned when the Connect2id server
# encounters an exception retrieving claims for it. The recommendation is to
# ignore such exceptions and always return an ID token. The default value is
# true (ignore errors).
op.idToken.ignoreClaimsSourceErrors=true

# Deprecated, use op.idToken.ignoreClaimsSourceErrors instead.
op.idToken.ignoreUserInfoError=

# The type ("typ") header of issued ID tokens. Explicit JWT typing is a simple
# measure to prevent mix-up of ID token JWTs with other types of JWT without
# having to examine the JWT claims structure. Note this is a non-standard
# feature and may result in rejection of ID tokens by client libraries not able
# or not configured to handle typing. Typing is disabled by default.
op.idToken.jwtType=


### Rich Authorisation Requests (RAR) ###

# The supported authorisation details types, as comma and / or space separated
# list. When specified the "authorization_details" in requests will be checked
# against this list and unsupported types will be rejected with an
# "invalid_authorization_details" error. The types will also be advertised in
# the OpenID provider / OAuth 2.0 authorisation server metadata. The default
# value is none (no check).
op.rar.supportedTypes=


### Pushed authorisation requests (PAR) ###

# The lifetime of the pushed authorisation requests, in seconds. Must not be
# shorter than 10 seconds. The default value is 60 seconds.
op.par.lifetime=60

# Enforces a global pushed authorisation request policy. If true only pushed
# authorisation requests will be accepted, regular and JAR authorisation
# requests will be rejected at the authorisation endpoint with an
# "invalid_request" error. The default value is false.
op.par.require=false


### Authorisation endpoint ###

# The OAuth 2.0 authorisation endpoint of the Connect2id server. Must be set to
# the URL of the OpenID login page (hosted separately from the Connect2id
# server). The URL schema should be "https". The URL can be also be specified
# relative to the OpenID provider issuer URL (op.issuer).
op.authz.endpoint=http://127.0.0.1:8080/c2id-login

# The access token for the authorisation session endpoint, represented by its
# SHA-256 hash (in hexadecimal format). The hash is a measure to prevent
# accidental leakage of the token through configuration files, logs, etc. The
# token is of type Bearer, non-expiring and must contain at least 32 random
# alphanumeric characters to make brute force guessing impractical.
#
# Additional access tokens, for token roll-over or other needs, can be
# configured by appending a dot (.) with a unique label to the property name,
# e.g. as op.authz.apiAccessTokenSHA256.1=abc...
#
# Evaluation note: Use token value ztucZS1ZyFKgh0tUEruUtiSTXhnexmd6
op.authz.apiAccessTokenSHA256=cca68b8b82bcf0b96cb826199429e50cd95a042f8e8891d1ac56ab135d096633

# The authorisation session lifetime, in minutes. The default value is 15
# minutes.
op.authz.sessionLifetime=15

# The enabled OAuth 2.0 "response_type" values, separated by comma. The default
# value is all supported.
#
# Supported OAuth 2.0 and OpenID Connect response types:
#
#     * code
#     * token
#     * id_token
#     * id_token token
#     * code id_token
#     * code id_token token
#
op.authz.responseTypes=code,token,id_token,id_token token,code id_token,code id_token token

# The enabled OAuth 2.0 "response_mode" values. The default value is all
# standard supported.
#
# Supported standard response modes:
#
#     * query
#     * fragment
#     * form_post
#     * query.jwt
#     * fragment.jwt
#     * form_post.jwt
#     * jwt
#
# The list may include custom (non-standard, experimental) response modes, such
# as based on CORS Ajax or window.postMessage provided the authorisation
# session handler (the login page) is able to support them.
#
# At a minimum "query" and "fragment" must be included.
op.authz.responseModes=query,fragment,form_post,query.jwt,fragment.jwt,form_post.jwt,jwt

# If true client requests to switch between the "query" and "fragment" response
# modes by setting the "response_mode" authorisation request parameter are
# prohibited. The default value is false.
op.authz.prohibitSwitchBetweenBasicResponseModes=false

# If true the requested scope values in the consent prompt for OAuth 2.0
# authorisation / OpenID authentication requests will be automatically reduced
# to those values registered in the "scope" client metadata field (provided the
# metadata field is set, otherwise this configuration has no effect on the
# client and all scope values requested by it will be passed on to the consent
# prompt). If false all scope values requested by clients will be passed on to
# the consent prompt. The default value is true. Since v14.0.
op.authz.limitToRegisteredScope=true

# The accepted JWS algorithms for signed OAuth 2.0 authorisation requests (JAR)
# passed with the optional "request_uri" or "request" parameter. An empty value
# implies JAR is not accepted. The default value is all supported, with "none"
# excluded.
#
# Supported JWS algorithms:
#
#     * HS256
#     * HS384
#     * HS512
#     * RS256
#     * RS384
#     * RS512
#     * PS256
#     * PS384
#     * PS512
#     * ES256
#     * ES256K
#     * ES384
#     * ES512
#     * none (use not recommended)
#
# The first JWS algorithm in the list becomes the default algorithm in client
# registration.
op.authz.requestJWSAlgs=HS256,HS384,HS512,RS256,RS384,RS512,PS256,PS384,PS512,ES256,ES256K,ES384,ES512

# The accepted JWE algorithms for encrypted OAuth 2.0 authorisation requests
# (JAR) passed with the optional "request_uri" or "request" parameter. An empty
# value implies JWE JAR is not accepted. The default value is all supported.
#
# Supported JWE algorithms:
#
#     * RSA-OAEP-256
#     * RSA-OAEP-384
#     * RSA-OAEP-512
#     * RSA-OAEP (use no longer recommended)
#     * RSA1_5 (use no longer recommended)
#     * ECDH-ES
#     * ECDH-ES+A128KW
#     * ECDH-ES+A192KW
#     * ECDH-ES+A256KW
#     * dir
#
op.authz.requestJWEAlgs=RSA-OAEP-256,RSA-OAEP-384,RSA-OAEP-512,ECDH-ES,ECDH-ES+A128KW,ECDH-ES+A192KW,ECDH-ES+A256KW,dir

# The accepted JWE content encryption methods for encrypted OAuth 2.0
# authorisation requests (JAR) passed with the optional "request_uri" or
# "request" parameter. The default value is all supported.
#
# Supported JWE methods:
#
#     * A128CBC-HS256
#     * A192CBC-HS384
#     * A256CBC-HS512
#     * A128GCM
#     * A192GCM
#     * A256GCM
#     * XC20P
#
op.authz.requestJWEEncs=A128CBC-HS256,A192CBC-HS384,A256CBC-HS512,A128GCM,A192GCM,A256GCM,XC20P

# The accepted JWS algorithms for signed OAuth 2.0 authorisation responses
# (JARM). RS256 is the default algorithm when a client explicitly requests a
# JWT-secured authorisation response by means of the "response_mode" request
# parameter and isn't registered for a specific JWS algorithm. If RS256 isn't
# in the list of supported algorithms then the first in the list will apply.
# An empty value implies JARM is not accepted. The default value is all supported.
#
# Supported JWS algorithms:
#
#     * HS256
#     * HS384
#     * HS512
#     * RS256
#     * RS384
#     * RS512
#     * PS256
#     * PS384
#     * PS512
#     * ES256
#     * ES256K
#     * ES384
#     * ES512
#     * EdDSA
#
op.authz.responseJWSAlgs=HS256,HS384,HS512,RS256,RS384,RS512,PS256,PS384,PS512,ES256,ES256K,ES384,ES512,EdDSA

# The accepted JWE algorithms for encrypted OAuth 2.0 authorisation responses
# (JARM). Note, encryption is always applied after signing. An empty value
# implies JWE JARM is not accepted. The default value is all supported.
#
# Supported JWE algorithms:
#
#     * RSA-OAEP-256
#     * RSA-OAEP-384
#     * RSA-OAEP-512
#     * RSA-OAEP (use no longer recommended)
#     * RSA1_5 (use no longer recommended)
#     * ECDH-ES
#     * ECDH-ES+A128KW
#     * ECDH-ES+A192KW
#     * ECDH-ES+A256KW
#     * dir
#
op.authz.responseJWEAlgs=RSA-OAEP-256,RSA-OAEP-384,RSA-OAEP-512,ECDH-ES,ECDH-ES+A128KW,ECDH-ES+A192KW,ECDH-ES+A256KW,dir

# The accepted JWE content encryption methods for encrypted OAuth 2.0
# authorisation responses (JARM). The default value is all supported.
#
# Supported JWE methods:
#
#     * A128CBC-HS256
#     * A192CBC-HS384
#     * A256CBC-HS512
#     * A128GCM
#     * A192GCM
#     * A256GCM
#     * XC20P
#
op.authz.responseJWEEncs=A128CBC-HS256,A192CBC-HS384,A256CBC-HS512,A128GCM,A192GCM,A256GCM,XC20P

# Enables / disables inclusion of the X.509 certificate chain ("x5c") header
# parameter in signed OAuth 2.0 authorisation responses (JARM) when the signing
# JWK is provisioned with a certificate. The default value is true (enabled).
op.authz.responseJWTIncludeX5C=true

# If true the Connect2id server will include the registered OAuth 2.0 / OpenID
# Connect client information in the authentication prompt. The client details
# can then be used as an additional input to determine the appropriate
# end-user authentication or session settings. The default value is false.
#
# The client information is typically required only at the consent step
# (implies false).
op.authz.includeClientInfoInAuthPrompt=false

# If true the Connect2id server will include the registered OAuth 2.0 / OpenID
# Connect client information in the final response of an authorisation
# session. The default value is false.
#
# The client information is typically required only at the consent step
# (implies false).
op.authz.includeClientInfoInFinalResponse=false

# If true the Connect2id server will include the subject (end-user) session in
# the final response of an authorisation session as well as in non-redirecting
# errors. The default value is false.
#
# The subject session is typically required only when a UI is presented, i.e.
# at the authentication and consent steps (implies false).
op.authz.includeSubjectSessionInFinalResponse=false

# If true the Connect2id server will include non-requested scope values and
# claim names for which previous consent exists in the consent prompt. The
# default value is false.
#
# If false only those scope values and claim names that are explicitly
# requested by the client will be included in the consent prompt.
op.authz.includeOtherConsentedScopeAndClaimsInPrompt=false

# If true the Connect2id server will include the raw OpenID "claims" request
# parameter in the consent prompt, under "claims" -> "raw_request". The default
# value is false.
op.authz.includeRawClaimsRequestInPrompt=false

# Names of selected OAuth 2.0 authorisation request parameters to include in
# the authentication prompt. No parameters are included by default. Since
# v11.6.
op.authz.requestParamsInAuthPrompt=

# Names of selected OAuth 2.0 authorisation request parameters to include in
# the consent prompt. No parameters are included by default. Since v11.6.
op.authz.requestParamsInConsentPrompt=

# The Connect2id server is normally configured (false) to always skip the
# authentication step, provided the end-user has a valid session (established
# by a cookie) and the authentication strength requirement (ACCR) of the client
# are met.
#
# If true the Connect2id server will act as if the client set a prompt=login
# authorisation request parameter. It will always prompt for authentication,
# even if the end-user is currently authenticated (has a valid session). This
# can be used to ensure some custom logic or script is always executed during
# the authentication step. OpenID prompt=none authentication requests will be
# handled according to op.authz.alwaysPromptMode
#
# The default value is false.
op.authz.alwaysPromptForAuth=false

# The Connect2id server is normally configured (false) to always skip the
# consent step, provided such is already recorded for a given end-user and
# client.
#
# If true the Connect2id server will act as if the client set a prompt=consent
# authorisation request parameter. It will always prompt for consent, even if
# previous consent for the end-user and client exists. This can be used to
# ensure some custom logic or script is always executed during the consent
# step. OpenID prompt=none authentication requests will be handled according to
# op.authz.alwaysPromptMode
#
# The default value is false.
op.authz.alwaysPromptForConsent=false

# Controls processing of OpenID prompt=none authentication requests when
# op.authz.alwaysPromptForAuth or op.authz.alwaysPromptForConsent is enabled.
# The default value is PROMPT_NONE.
#
# Supported modes:
#
#     * LIMITED -- No authentication or consent prompt will be returned on a
#       OpenID prompt=none authentication request. The Connect2id server will
#       proceed straight to returning the final response (success or
#       login_required / consent_required error).
#     * PROMPT_NONE -- An authentication or consent prompt will be returned on
#       a OpenID prompt=none authentication request provided an existing
#       session or consent is found and the request can be fulfilled with no
#       end-user interaction. This is the default mode for legacy reasons.
#     * PROMPT_NONE_WITH_INTERACTION_ERRORS -- An authentication or consent
#       prompt will be returned on a OpenID prompt=none authentication request
#       even if the request cannot be fulfilled due to required end-user
#       interaction; in that case the login page must handle the login_required
#       and consent_required errors by itself.
#
op.authz.alwaysPromptMode=PROMPT_NONE

# If true the "redirect_uri" parameter will be required for all authorisation
# requests, not only for OpenID authentication requests. The default value is
# false (required only for OpenID authentication requests).
op.authz.alwaysRequireRedirectURI=false

# The allowed PKCE (RFC 7636) code challenge methods which OAuth 2.0 clients
# may use at the authorisation endpoint, as comma and / or space separated
# list. The default value is all supported.
#
# Supported PKCE methods:
#
#     * plain
#     * S256
#
op.authz.allowedPKCE=plain,S256

# The required PKCE (RFC 7636) code challenge methods which OAuth 2.0 clients
# must use at the authorisation endpoint, as comma and / or space separated
# list. If empty or omitted PKCE is not required.
#
# Supported PKCE methods:
#     * plain
#     * S256
#
op.authz.requiredPKCE=

# Specifies if a valid ID token hint ("id_token_hint") parameter is required
# for prompt=none authorisation requests. The default value is false (not
# required).
op.authz.requireIDTokenHintWithPromptNone=false

# The policy for merging unsecured parameters in a JWT-secured OAuth 2.0
# authorisation request (JAR) (excluding OpenID authentication requests).
# Also applies to Pushed Authorisation Requests (PAR): JAR requests submitted
# to the PAR endpoint and PAR request_uri's in authorisation requests. The
# default value is STRICT.
#
# Supported policies:
#
#     * STRICT -- Use only JWT-secured parameters, unsecured query parameters
#       will be ignored. This is the default policy.
#     * MERGE_UNSECURED -- Merge unsecured authorisation request query
#       parameters, with the JWT-secured parameters having precedence.
#
op.authz.oAuthRequestJWTPolicy=STRICT

# The policy for merging unsecured parameters in a JWT-secured OpenID
# authentication request. Also applies to Pushed Authorisation Requests (PAR):
# JWT-secured requests submitted to the PAR endpoint and PAR request_uri's in
# authentication requests. The default value is MERGE_UNSECURED.
#
# Supported policies:
#
#     * STRICT -- Use only JWT-secured parameters, unsecured query parameters
#       will be ignored.
#     * MERGE_UNSECURED -- Merge unsecured OpenID authentication request
#       query parameters, with the JWT-secured parameters having precedence.
#       This is the default policy.
#
op.authz.openIDRequestJWTPolicy=MERGE_UNSECURED

# If true a JWS signed request JWT passed inline via "request" or by URL
# reference via "request_uri" will be required for all authorisation requests,
# including pushed authorisation requests (PAR). The default value is false
# (not required unless the client is explicitly registered for it).
op.authz.alwaysRequireSignedRequestJWT=false

# If true received request JWTs must include an expiration ("exp") claim. The
# default value is false.
op.authz.requireRequestJWTExpiration=false

# If true received request JWTs must include a not-before ("nbf") claim. The
# default value is false.
op.authz.requireRequestJWTNotBefore=false

# The maximum accepted lifetime in seconds of an expiration ("exp") claim in
# request JWTs. The lifetime is computed from the not-before ("nbf") claim if
# present, otherwise from the current time. The default value is -1 (not
# specified).
op.authz.maxLifetimeRequestJWTExpiration=-1

# The maximum accepted age in seconds of a not-before ("nbf") claim in request
# JWTs. The default value is -1 (not specified).
op.authz.maxAgeRequestJWTNotBefore=-1

# If true received request JWTs must cover all authorisation request
# parameters, those with unsecured parameters will be rejected with an
# "invalid_request" error. The default value is false.
op.authz.requireAllParamsInRequestJWT=false

# If true all authorisation requests must specify a JWT-secured response (JARM)
# or a "response_type" that includes an "id_token" to serve as a detached
# signature. The default value is false.
op.authz.alwaysRequireSignedResponse=false

# If true claims stored in the subject (end-user) session are automatically fed
# as additional claims into the issued ID tokens (for all clients). Applies to
# regular and prompt=none OpenID authentication requests as well as ID token
# refreshes. Deprecated in v15.9, use op.idToken.includeSubjectSessionClaims
# instead.
op.authz.feedSubjectSessionClaimsIntoIDToken=

# Additional custom OAuth 2.0 error codes allowed to be returned at the
# authorisation endpoint, as a space / comma separated list.
op.authz.customErrorCodes=

# The supported OAuth 2.0 scope values to advertise in the OpenID provider /
# OAuth 2.0 authorisation server metadata, as comma and / or space separated
# list. The "openid" scope value must be always included. The standard OpenID
# scope values should be included if supported. Other scope values that are
# custom or application-specific may not be advertised. The default value is
# "openid".
op.authz.advertisedScopes=openid

# The supported OpenID claims (standard and custom) to advertise in the OpenID
# provider metadata, as comma and / or space separated list. The "sub" (subject
# / end-user identifier) claim name must be always included. Note that for
# privacy or other reasons, this might not be an exhaustive list. The default
# value is "sub".
op.authz.advertisedClaims=sub

# The supported Authentication Context Class References, also called levels of
# assurance (LoA), to advertise in the OpenID provider metadata, as comma and
# / or space separated list. Leave blank if none.
#
# Important: For proper step-up authentication, order the ACRs from lowest to
# highest (basic to high).
op.authz.advertisedACRs=

# The supported "display" parameter values to advertise in the OpenID provider
# metadata, as comma and / or space separated list. The default value is
# "page".
#
# Standard display values:
#
#     * page
#     * popup
#     * touch
#     * wap
#
op.authz.advertisedDisplayTypes=page

# The supported languages and scripts for the user interface, represented as
# BCP47 (RFC 5646) language tag values, to advertise in the OpenID provider
# metadata, as comma and / or space separated list. Leave blank if not
# specified.
op.authz.advertisedUILocales=


### Token endpoint ###

# The enabled client authentication methods. The first method in the list
# specifies the default for clients that don't specify an explicit method at
# registration.
#
# The "tls_client_auth" and "self_signed_tls_client_auth" methods are mutually
# exclusive and cannot be enabled simultaneously. When enabled the 
# "op.tls.clientX509CertHeader" configuration property must be set.
#
# The "none" method enables public (unauthenticated) clients.
#
# The default value is all supported, with "tls_client_auth" and
# "self_signed_tls_client_auth" excluded.
#
# Supported authentication methods:
#
#     * client_secret_basic
#     * client_secret_post
#     * client_secret_jwt
#     * private_key_jwt
#     * tls_client_auth
#     * self_signed_tls_client_auth
#     * none
#
op.token.authMethods=client_secret_basic,client_secret_post,client_secret_jwt,private_key_jwt,none

# The enabled JWS algorithms for "client_secret_jwt" and "private_key_jwt"
# client authentication. The default value is all supported.
#
# Supported JWS algorithms:
#
# For client_secret_jwt authentication: HS256, HS384, HS512
#
# For private_key_jwt authentication: RS256, RS384, RS512, PS256, PS384, PS512,
# ES256, ES256K, ES384, ES512
op.token.authJWSAlgs=HS256,HS384,HS512,RS256,RS384,RS512,PS256,PS384,PS512,ES256,ES256K,ES384,ES512

# The JWT "aud" (audience) check for "client_secret_jwt" and "private_key_jwt"
# client authentication. The default value is LEGACY.
#
# Supported JWT audience checks:
#
#     * LEGACY -- The "aud" may be multi-valued and contain values other than
#       the endpoint URL or the issuer URL of the OpenID provider / OAuth 2.0
#       authorisation server.
#     * STRICT -- The "aud" must be single-valued and set to the issuer URL of
#       the OpenID provider / OAuth 2.0 authorisation server.
#
op.token.authJWTAudience=LEGACY

# Optional JSON query to override of the JWT "aud" (audience) check for
# "client_secret_jwt" and "private_key_jwt" client authentication for selected
# clients.
#
# The JSON query is applied to the custom "data" JSON object of the registered
# client metadata and must return a "LEGACY" or "STRICT" string
# (case-insensitive). The default value is no overriding JSON query.
op.token.authJWTAudienceQuery=

# If true replay of "client_secret_jwt" and "private_key_jwt" client
# assertions will be prevented, by caching the JWT "jti" claim for the duration
# of the assertion lifetime but no longer than 5 minutes. The default value is
# true.
op.token.authJWTPreventReplay=true

# The maximum allowed number of seconds of the expiration time (exp) claim in
# "client_secret_jwt" and "private_key_jwt" client assertions ahead of the
# current time. Assertions with longer expiration will be rejected with an
# "invalid_client" error. If zero or negative this check is disabled. When
# enabled the value must be between 10 and 600 seconds. The default value is -1
# (disabled).
op.token.authJWTExpMaxAhead=-1

# If true the token endpoint will require a client X.509 certificate from all
# clients, in order to enforce issue of client certificate bound access tokens
# (RFC 8705). The default value is false.
op.token.requireClientX509Cert=false


### Token introspection endpoint ###

# If true causes the audience ("aud") in token introspection responses to be
# pruned to the client_id of the introspecting client, intended to prevent
# revealing information about recipients other than the intended in
# multi-audience tokens. If false the complete token audience will be shown.
# Has no effect on tokens that don't specify an audience. The default value is
# true.
op.token.introspection.pruneAudience=true

# If true causes the token introspection responses to be always returned as a
# JWT signed with the same JWS algorithm and key as self-contained (JWT) access
# tokens. The default value is false.
op.token.introspection.alwaysRespondWithJWT=false

# The type ("typ") header of JWT introspection responses. The default value is
# "token-introspection+jwt". This configuration enables the type header to be
# set to "JWT" for non-compliant clients and JWT libraries which cannot handle
# header values other than "JWT".
op.token.introspection.jwtType=token-introspection+jwt


### UserInfo Endpoint ###

# The enabled JWS algorithms for signing issued UserInfo JWTs. The default
# value is all supported.
#
# Supported JWS algorithms:
#
#     * RS256
#     * RS384
#     * RS512
#     * PS256
#     * PS384
#     * PS512
#     * ES256
#     * ES256K
#     * ES384
#     * ES512
#     * HS256
#     * HS384
#     * HS512
#     * EdDSA
#
op.userinfo.jwsAlgs=RS256,RS384,RS512,PS256,PS384,PS512,ES256,ES256K,ES384,ES512,HS256,HS384,HS512,EdDSA

# The enabled JWE key management algorithms for applying optional additional
# encryption to issued UserInfo JWTs. The default value is all supported.
#
# Supported JWE algorithms:
#
#     * RSA-OAEP-256
#     * RSA-OAEP-384
#     * RSA-OAEP-512
#     * RSA-OAEP (use no longer recommended)
#     * RSA1_5 (use no longer recommended)
#     * ECDH-ES
#     * ECDH-ES+A128KW
#     * ECDH-ES+A192KW
#     * ECDH-ES+A256KW
#     * dir
#     * A128KW
#     * A192KW
#     * A256KW
#     * A128GCMKW
#     * A192GCMKW
#     * A256GCMKW
#
op.userinfo.jweAlgs=RSA-OAEP-256,RSA-OAEP-384,RSA-OAEP-512,ECDH-ES,ECDH-ES+A128KW,ECDH-ES+A192KW,ECDH-ES+A256KW,dir,A128KW,A192KW,A256KW,A128GCMKW,A192GCMKW,A256GCMKW

# The enabled JWE content encryption methods for applying optional additional
# encryption to issued UserInfo JWTs. The default value is all supported.
#
# Supported JWE methods:
#
#     * A128CBC-HS256
#     * A192CBC-HS384
#     * A256CBC-HS512
#     * A128GCM
#     * A192GCM
#     * A256GCM
#     * XC20P
#
op.userinfo.jweEncs=A128CBC-HS256,A192CBC-HS384,A256CBC-HS512,A128GCM,A192GCM,A256GCM,XC20P

# If true the UserInfo endpoint will allow access tokens submitted via the
# `access_token` URI query parameter. The default policy (`false`) is to reject
# access tokens received via the URI query parameter in order to prevent
# potential token leakage via web server access logs. The URI query method
# should not be allowed unless it is impossible to transport the access token
# in the "Authorization" request header field or the HTTP request entity-body.
op.userinfo.allowAccessTokenInURIQuery=false

# The type ("typ") header of issued UserInfo JWTs. Explicit JWT typing is a
# simple measure to prevent mix-up of UserInfo JWTs with other types of JWT
# without having to examine the JWT claims structure. Note this is a
# non-standard feature and may result in rejection of UserInfo JWTs by client
# libraries not able or not configured to handle typing. Typing is disabled by
# default.
op.userinfo.jwtType=


### Check session iframe ###

# The OpenID Connect check session iframe URL. The URL schema should be
# "https". The URL can be also be specified relative to the OpenID provider
# issuer URL.
#
# Browser JavaScript code running in the iframe must be able to access the
# cookie (see op.checkSession.cookieName) used to store the subject (end-user)
# session ID. This requires the iframe to have the same web origin (domain) as
# the login page which set the session cookie. The cookie must also be set with
# a path visible by the iframe and without the "HttpOnly" flag.
#
# If blank check session support is disabled and the iframe is not advertised
# in the OpenID provider metadata.
#
# The Connect2id server provides a default check session iframe at
# "/check-session.html" relative to the OpenID provider issuer URL (op.issuer).
op.checkSession.iframe=

# The name of the cookie which is used by the login page to store the subject
# (end-user) session ID. The cookie must be accessible from browser JavaScript
# running in the check session iframe (see op.checkSession.iframe), i.e. it
# must be set with a common path and without the "HttpOnly" flag.
op.checkSession.cookieName=sid


### Logout (end-session) endpoint ###

# The OpenID Connect Logout (end-session) endpoint of the Connect2id server.
# Must be set to the URL of the OpenID provider logout page (hosted separately
# from the Connect2id server). The URL schema should be "https". The URL can
# also be specified relative to the OpenID provider issuer URL (op.issuer).
#
# If blank the endpoint is disabled and not advertised in the OpenID provider
# metadata. OpenID relying party initiated logout requests will be refused.
op.logout.endpoint=

# The access token for the logout session endpoint, represented by its SHA-256
# hash (in hexadecimal format). The hash is a measure to prevent accidental
# leakage of the token through configuration files, logs, etc. The token is of
# type Bearer, non-expiring and must contain at least 32 random alphanumeric
# characters to make brute force guessing impractical.
#
# Additional access tokens, for token roll-over or other needs, can be
# configured by appending a dot (.) with a unique label to the property name,
# e.g. as op.logout.apiAccessTokenSHA256.1=abc...
#
# Evaluation note: Use token value ztucZS1ZyFKgh0tUEruUtiSTXhnexmd6
op.logout.apiAccessTokenSHA256=cca68b8b82bcf0b96cb826199429e50cd95a042f8e8891d1ac56ab135d096633

# The logout session lifetime, in minutes. The default value is 10 minutes.
op.logout.sessionLifetime=10


### Back-channel Logout ###

# If true logout tokens will be explicitly typed with a JWT type ("typ") header
# set to "logout+jwt". Explicit JWT typing is a simple measure to prevent
# mix-up of logout token JWTs with other types of JWT without having to examine
# the JWT claims structure. Enabled by default.
op.logout.backChannel.jwtTypeExplicit=true

# The HTTP connect timeout (in milliseconds) for posting a logout token. Zero
# means no timeout. Must not be negative. The default value is 1000 ms.
op.logout.backChannel.httpConnectTimeout=1000

# The HTTP read timeout (in milliseconds) for posting a logout token. Zero
# means no timeout. Must not be negative. The default value is 1000 ms.
op.logout.backChannel.httpReadTimeout=1000


### CIBA ###

# Enables / disables OpenID Connect Client-Initiated Backchannel Authentication
# (CIBA) Flow - Core 1.0 support. Disabled by default.
op.ciba.enable=false

# The enabled CIBA token delivery modes. The default value is all supported.
#
# Supported modes:
#
#     * poll
#
op.ciba.tokenDeliveryModes=poll

# The enabled CIBA hint types. The default value is all supported.
#
# Supported hint types:
#
#     * login_hint_token
#     * id_token_hint
#     * login_hint
#
op.ciba.hintTypes=login_hint_token,id_token_hint,login_hint

# The enabled JWS algorithms for signed CIBA requests. The default value is all
# supported.
#
# Supported JWS algorithms:
#
#     * RS256
#     * RS384
#     * RS512
#     * PS256
#     * PS384
#     * PS512
#     * ES256
#     * ES256K
#     * ES384
#     * ES512
#
op.ciba.requestJWSAlgs=RS256,RS384,RS512,PS256,PS384,PS512,ES256,ES256K,ES384,ES512

# Regular expression pattern for matching legal CIBA binding messages. Messages
# that don't match the pattern will be rejected with an invalid_binding_message
# error. The pattern must be BASE64 encoded to prevent character escaping
# issues. The default unencoded pattern is "[\w ]{4,16}", allowing
# combinations of four to sixteen alphanumeric and space characters.
op.ciba.bindingMessagePattern=W1x3IF17NCwxNn0=

# Enables / disables support for the CIBA user_code parameter. The default
# value is true.
op.ciba.supportUserCode=true

# The default lifetime of CIBA requests (auth_req_id), in seconds. Applied when
# a CIBA request doesn't specify a requested_expiry parameter. Must not be
# shorter than 60 seconds. The default value is 600 seconds (10 minutes).
op.ciba.defaultRequestLifetime=600

# The maximum allowed lifetime of the requested_expiry parameter of CIBA
# requests (auth_req_id), in seconds. Must not be shorter than the default
# lifetime of CIBA requests. The default value is the default request lifetime.
op.ciba.maxRequestLifetime=


### Federation ###

# Enables / disables OpenID Connect Federation 1.0. Disabled by default.
op.federation.enable=false

# The enabled OpenID Connect Federation 1.0 client registration types.
#
# Supported client registration types:
#
#     * explicit
#     * automatic
#
op.federation.clientRegistrationTypes=explicit,automatic

# The enabled methods for authenticating OpenID Connect Federation 1.0
# automatic client registration requests at the OAuth 2.0 authorisation
# endpoint.
#
# Supported methods:
#
#     * request_object
#
op.federation.autoClientAuthMethods.ar=request_object

# The enabled methods for authenticating OpenID Connect Federation 1.0
# automatic client registration requests at the OAuth 2.0 pushed authorisation
# request (PAR) endpoint.
#
# Supported methods:
#
#     * private_key_jwt
#     * tls_client_auth
#     * self_signed_tls_client_auth
#
op.federation.autoClientAuthMethods.par=private_key_jwt,tls_client_auth,self_signed_tls_client_auth

# The organisation name in the federation. Leave blank if not specified.
op.federation.organizationName=

# The configured trust anchors. Must contain at least one entity ID.
op.federation.trustAnchors.1=

# The trust anchors or intermediate entities that may issue an entity statement
# about this OpenID Connect provider. Must contain at least one entity ID.
op.federation.authorityHints.1=
op.federation.authorityHints.2=
op.federation.authorityHints.3=

# The maximum path length when resolving trust chains. The default value is 2
# (up to two intermediates to the trust anchor).
op.federation.constraints.maxPathLength=2

# The explicitly permitted entity IDs when resolving trust chains. Leave blank
# if not specified.
op.federation.constraints.permitted.1=
op.federation.constraints.permitted.2=
op.federation.constraints.permitted.3=

# The excluded entity IDs when resolving trust chains. Leave blank if not
# specified.
op.federation.constraints.excluded.1=
op.federation.constraints.excluded.2=
op.federation.constraints.excluded.3=

# The HTTP connect timeout (in milliseconds) when resolving trust chains. Zero
# implies no timeout. Must not be negative. The default value is 1000 ms.
op.federation.httpConnectTimeout=1000

# The HTTP read timeout (in milliseconds) when resolving trust chains. Zero
# implies no timeout. Must not be negative. The default value is 1000 ms.
op.federation.httpReadTimeout=1000

# List of contacts for this federation entity. These may contain names, e-mail
# addresses, descriptions, phone numbers, etc. Leave blank if not specified.
op.federation.contacts.1=
op.federation.contacts.2=
op.federation.contacts.3=

# URL of the federation entity logo. The URL can be also specified relative to
# the issuer URL (op.issuer). Leave blank if not specified.
op.federation.logoURI=

# URL of the federation entity policy. The URL can be also specified relative
# to the issuer URL (op.issuer). Leave blank if not specified.
op.federation.policyURI=

# URL of the federation entity homepage. The URL can be also specified relative
# to the issuer URL (op.issuer). Leave blank if not specified.
op.federation.homepageURI=

# Trust marks about this federation entity as signed JSON Web Tokens (JWT).
# Leave blank if not specified.
op.federation.trustMarks.1=
op.federation.trustMarks.2=
op.federation.trustMarks.3=

# The lifetime of issued entity statements, in seconds. The default value is
# 604800 seconds (1 week).
op.federation.entityStatementLifetime=604800

# The lifetime of registered OpenID Connect Federation 1.0 automatic clients,
# in seconds. If zero or negative the lifetime will be determined by the trust
# chain expiration time. When explicitly set must not be shorter than 5 minutes
# (300 seconds) to allow sufficient time for the completion of a single OAuth
# 2.0 flow with an authorisation, token and UserInfo request by the registered
# relying party. The default value is 3600 seconds (1 hour).
op.federation.autoClientLifetime=3600


