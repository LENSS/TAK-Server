### Security Token Service (STS) Configuration ###

# Master access token for the STS web API to issue OAuth 2.0 JWT-secured
# Authorisation Requests (JAR), also called request objects in OpenID Connect,
# represented by its SHA-256 hash (in hexadecimal format). The hash is a
# measure to prevent accidental leakage of the token through configuration
# files, logs, etc. The token is of type Bearer, non-expiring and must contain
# at least 32 random alphanumeric characters to make brute force guessing
# impractical. If not specified issue of JARs by the STS web API is disabled.
#
# Additional access tokens, for token roll-over or other needs, can be
# configured by appending a dot (.) with a unique label to the property name,
# e.g. as op.sts.jar.apiAccessTokenSHA256.1=abc...
op.sts.jar.apiAccessTokenSHA256=

# Master access token for the STS web API to issue private key JWTs
# ("private_key_jwt") for client authentication, represented by its SHA-256
# hash (in hexadecimal format). The hash is a measure to prevent accidental
# leakage of the token through configuration files, logs, etc. The token is of
# type Bearer, non-expiring and must contain at least 32 random alphanumeric
# characters to make brute force guessing impractical. If not specified issue
# of private key JWTs by the STS web API is disabled.
#
# Additional access tokens, for token roll-over or other needs, can be
# configured by appending a dot (.) with a unique label to the property name,
# e.g. as op.sts.privateKeyJWT.apiAccessTokenSHA256.1=abc...
op.sts.privateKeyJWT.apiAccessTokenSHA256=

# Master access token for the STS web API to issue login hint tokens
# ("login_hint_token") for CIBA, represented by its SHA-256 hash (in
# hexadecimal format). The hash is a measure to prevent accidental leakage of
# the token through configuration files, logs, etc. The token is of type
# Bearer, non-expiring and must contain at least 32 random alphanumeric
# characters to make brute force guessing impractical. If not specified and the
# direct issue option is not allowed, issue of login hint tokens by the STS web
# API is disabled.
#
# Additional access tokens, for token roll-over or other needs, can be
# configured by appending a dot (.) with a unique label to the property name,
# e.g. as op.sts.loginHintToken.apiAccessTokenSHA256.1=abc...
op.sts.loginHintToken.apiAccessTokenSHA256=

# If true an access token for the STS web API to issue login hint tokens
# ("login_hint_token") for CIBA is not required. A valid native IdP app session
# ID ("sub_sid") is sufficient to authorise login hint token issue. The default
# value is false (direct issue not allowed).
op.sts.loginHintToken.allowDirectIssue=false

# Master access token for the STS web API, represented by its SHA-256 hash (in
# hexadecimal format). The hash is a measure to prevent accidental leakage of
# the token through configuration files, logs, etc. The token is of type Bearer,
# non-expiring and must contain at least 32 random alphanumeric characters to
# make brute force guessing impractical. If not specified the web API is
# disabled.
#
# Additional access tokens, for token roll-over or other needs, can be
# configured by appending a dot (.) with a unique label to the property name,
# e.g. as op.sts.apiAccessTokenSHA256.1=abc...
#
# Deprecated in v18.0, use the more specific op.sts.*.apiAccessTokenSHA256
# instead.
op.sts.apiAccessTokenSHA256=


### Mutual TLS Configuration ###

# If true submitted client X.509 certificates after passing the TLS layer will
# not be considered at the token endpoint for the purposes of OAuth 2.0 client
# authentication ("tls_client_auth" and "self_signed_tls_client_auth") and
# access token binding ("cnf.x5t#S256"). This can be used to prevent binding of
# issued access tokens to received client X.509 certificates when such binding
# is not desired. Blocking is disabled by default.
op.tls.blockClientX509Certs=false

# The name of the HTTP header to receive validated client X.509 certificates
# from a TLS termination proxy. Intended to facilitate PKI mutual-TLS client
# authentication ("tls_client_auth"), self-signed mutual-TLS client
# authentication ("self_signed_tls_client_auth") and issue of client
# certificate bound access tokens.
#
# The header name must be kept confidential between the TLS termination proxy
# and the Connect2id server and must include at least 32 random alphanumeric
# characters to make brute force guessing impractical.
#
# The header value must be a PEM-encoded representation of the client X.509
# certificate, with optional additional URL-encoding of the PEM string.
#
# If omitted or blank use of a TLS termination proxy for mutual-TLS client
# authentication is disabled.
# op.tls.clientX509CertHeader=X-Client-X509-Cert-alaeLuL8geiqu3OhOg1Mafa4Ecu9ahsh
